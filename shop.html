<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>KODER SHOP — Premium Gaming Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#070b12;font-family:'Inter',sans-serif;color:#e8edf5;min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at 20% 20%,#0b1a2b,#05080e);-webkit-tap-highlight-color:transparent}
    .app{max-width:480px;width:100%;padding:12px 14px 100px;min-height:100vh;position:relative}
    @media(min-width:640px){.app{max-width:600px;padding:20px 24px 100px}.grid{grid-template-columns:repeat(3,1fr)!important}}
    @media(min-width:1024px){.app{max-width:820px}.grid{grid-template-columns:repeat(4,1fr)!important}}

    /* HERO */
    .hero{position:relative;border-radius:22px;padding:22px 16px 18px;margin-bottom:14px;overflow:hidden;border:1px solid rgba(0,255,255,.12);background:linear-gradient(170deg,rgba(9,16,32,.98),rgba(6,11,22,.97));box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .hero::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1.5px;background:linear-gradient(160deg,rgba(0,220,255,.25),rgba(168,85,247,.15),rgba(236,72,153,.12));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-family:'Orbitron',sans-serif;font-size:.5rem;font-weight:700;letter-spacing:2px;color:#a5f3fc;background:rgba(0,200,255,.12);border:1px solid rgba(0,220,255,.3);margin:0 auto 12px}
    .hero-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.5rem,6vw,1.9rem);font-weight:900;text-align:center;line-height:1.2}
    .hero-title span{background:linear-gradient(135deg,#f4fcff,#00e5ff 42%,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-title em{font-style:normal;background:linear-gradient(135deg,#efe8ff,#a855f7 48%,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-sub{text-align:center;font-size:.5rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7dd3fc;opacity:.8;margin-top:6px}
    .hero-status{display:flex;justify-content:center;margin-top:14px}
    .hero-status span{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-size:.5rem;font-weight:800;letter-spacing:1px;color:#bbffe0;background:rgba(0,255,170,.1);border:1px solid rgba(0,255,170,.3)}
    .dot{width:7px;height:7px;border-radius:50%;background:#00ffb3;animation:pulse 1.7s ease-out infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,255,179,.5)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

    /* STATS */
    .stats{display:flex;gap:8px;margin-bottom:14px}
    .stat{flex:1;text-align:center;padding:12px 6px;border-radius:16px;background:linear-gradient(160deg,rgba(0,255,255,.07),rgba(168,85,247,.03));border:1px solid rgba(0,255,255,.12)}
    .stat .n{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:#00ffff}
    .stat .l{font-size:.42rem;color:#88aacc;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

    /* SEARCH + FILTER */
    .search{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(0,255,255,.12);margin-bottom:10px}
    .search input{flex:1;background:none;border:none;outline:none;color:#e0e6f0;font-size:.8rem}
    .search input::placeholder{color:#667a99}
    .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .fbtn{flex-shrink:0;padding:6px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:#8aacc0;font-size:.55rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
    .fbtn.active{background:linear-gradient(135deg,rgba(0,255,255,.18),rgba(168,85,247,.12));border-color:rgba(0,255,255,.4);color:#7df9ff}

    /* SECTION */
    .sec{margin-bottom:22px}
    .sec-h{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 10px;border-bottom:1px solid rgba(0,255,255,.08);margin-bottom:10px}
    .sec-h .name{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:#d0e8ff}
    .sec-h .cnt{font-size:.5rem;color:#88b0d0;padding:2px 10px;border-radius:20px;border:1px solid rgba(0,255,255,.08)}

    /* GRID CARDS */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .card{background:linear-gradient(165deg,rgba(14,24,40,.85),rgba(8,14,24,.75));border:1px solid rgba(0,255,255,.07);border-radius:20px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:.25s;position:relative;min-height:140px;display:flex;flex-direction:column;align-items:center}
    .card:hover{border-color:rgba(0,255,255,.28);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.3),0 0 30px rgba(0,255,255,.08)}
    .card:active{transform:scale(.97)}
    .card .badge{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:20px;font-size:.4rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff2d9b,#a855f7);text-transform:uppercase}
    .card .icon-wrap{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#00ffff;background:linear-gradient(145deg,rgba(0,255,255,.1),rgba(168,85,247,.08));border:1px solid rgba(0,255,255,.15);margin-bottom:8px}
    .card .cname{font-weight:800;font-size:.72rem;color:#f0f6ff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.9em}
    .card .cplat{margin-top:8px;font-size:.48rem;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
    .card .cplat.android{color:#bbffd6;background:rgba(0,220,120,.2);border:1px solid rgba(52,211,153,.45)}
    .card .cplat.ios{color:#c4eaff;background:rgba(0,160,255,.2);border:1px solid rgba(96,165,250,.45)}
    .card .out{margin-top:6px;font-size:.45rem;color:#f87171;font-weight:700}

    /* MODAL */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(16px);display:flex;align-items:flex-end;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:.3s;padding:0}
    .overlay.open{opacity:1;pointer-events:auto}
    .modal{background:linear-gradient(165deg,rgba(12,22,40,.97),rgba(8,14,26,.95));border:1px solid rgba(0,255,255,.12);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 16px 28px;transform:translateY(40px);transition:.35s cubic-bezier(.34,1.56,.64,1);-webkit-overflow-scrolling:touch}
    .overlay.open .modal{transform:translateY(0)}
    @media(min-width:520px){.overlay{align-items:center;padding:16px}.modal{border-radius:24px;max-height:85vh}}
    .modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#88aacc;font-size:1.2rem;cursor:pointer;opacity:.6}
    .modal-title{font-family:'Orbitron',sans-serif;font-size:.95rem;color:#00ffff;text-align:center;margin-bottom:4px}
    .modal-sub{text-align:center;font-size:.55rem;color:#88b0d0;margin-bottom:12px}
    .pkg{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:14px;background:rgba(12,22,38,.9);border:1px solid rgba(0,255,255,.08);margin-bottom:8px;gap:8px}
    .pkg .plabel{font-weight:700;font-size:.75rem;color:#e8f2ff}
    .pkg .pstock{font-size:.48rem;color:#88b0d0;margin-top:2px}
    .pkg .pprice{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:#00f0ff}
    .pkg .pbtn{padding:6px 14px;border-radius:30px;border:1px solid rgba(0,220,255,.35);background:rgba(0,220,255,.12);color:#7df9ff;font-size:.55rem;font-weight:700;cursor:pointer;white-space:nowrap}
    .pkg .pbtn:disabled{opacity:.35;cursor:not-allowed}
    .pkg.out-of-stock{opacity:.5}

    /* ORDER */
    .os-card{background:rgba(0,0,0,.2);border-radius:14px;padding:12px;margin:10px 0;border:1px solid rgba(0,255,255,.06)}
    .os-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.7rem}
    .os-row .l{color:#88b0d0}.os-row .v{font-weight:700;color:#f0f8ff}
    .coupon-row{display:flex;gap:8px;margin:10px 0}
    .coupon-row input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,255,255,.15);background:rgba(0,0,0,.25);color:#e8edf5;font-size:.75rem;outline:none;text-transform:uppercase}
    .coupon-row button{padding:10px 14px;border-radius:12px;border:1px solid rgba(0,220,255,.35);background:rgba(0,220,255,.12);color:#7df9ff;font-weight:700;font-size:.65rem;cursor:pointer}
    .msg-box{background:rgba(0,0,0,.25);border-radius:12px;padding:12px;font-size:.7rem;color:#b8d8ff;line-height:1.5;word-break:break-word;margin:10px 0;border:1px solid rgba(0,255,255,.06)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .actions button{flex:1;padding:12px;border-radius:40px;border:none;font-weight:700;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-copy{background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.2)!important;color:#00ffff}
    .btn-zalo{background:rgba(0,102,255,.1);border:1px solid rgba(0,102,255,.25)!important;color:#66bbff}
    .btn-close{background:rgba(255,50,80,.06);border:1px solid rgba(255,50,80,.15)!important;color:#ff88aa;flex:.3!important}

    /* NOTICE MODAL */
    #noticeOverlay{z-index:600}
    .notice-box{background:linear-gradient(165deg,rgba(8,28,48,.98),rgba(4,18,36,.97));border:1px solid rgba(0,229,255,.3);border-radius:20px;padding:24px 18px;max-width:400px;width:100%;margin:auto;text-align:center}
    .notice-box h2{font-family:'Orbitron',sans-serif;font-size:.85rem;color:#67e8f9;margin-bottom:10px}
    .notice-box p{font-size:.7rem;color:#c8d8ec;line-height:1.6;margin-bottom:16px}
    .notice-box button{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(0,220,255,.4);background:rgba(0,220,255,.15);color:#a5f3fc;font-weight:800;font-size:.7rem;cursor:pointer;margin-top:6px}

    /* TOAST */
    .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(8,18,32,.92);border:1px solid rgba(0,255,255,.2);padding:10px 20px;border-radius:40px;color:#00e5ff;font-size:.7rem;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.err{border-color:rgba(248,113,113,.4);color:#fca5a5}

    .loading{text-align:center;padding:40px;color:#88b0d0;font-size:.8rem}
    .empty{text-align:center;padding:30px;color:#ff66aa;font-size:.8rem}

    .footer{text-align:center;font-size:.48rem;color:#5a7a94;padding:20px 0 10px;opacity:.7}
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="hero">
    <div style="text-align:center"><div class="hero-badge"><i class="fas fa-bolt"></i> PREMIUM STORE</div></div>
    <div class="hero-title"><span>KODER</span> <em>SHOP</em></div>
    <div class="hero-sub">Gaming Mods & Tools</div>
    <div class="hero-status"><span><i class="dot"></i> HỆ THỐNG ONLINE</span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="stOnline">--</div><div class="l">Online</div></div>
    <div class="stat"><div class="n" id="stProducts">--</div><div class="l">Sản phẩm</div></div>
    <div class="stat"><div class="n" id="stRate">99.8%</div><div class="l">Success</div></div>
  </div>

  <div class="search">
    <i class="fas fa-search" style="color:#667a99;font-size:.8rem"></i>
    <input type="text" id="searchInput" placeholder="Tìm sản phẩm, game...">
  </div>
  <div class="filters" id="filters"></div>
  <div id="catalog"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Đang tải...</div></div>
  <div class="footer">© KODER SHOP · Support via Zalo</div>
</div>

<!-- PRODUCT MODAL -->
<div class="overlay" id="productOverlay">
  <div class="modal" style="position:relative">
    <button class="modal-close" id="closeProduct"><i class="fas fa-times"></i></button>
    <div class="modal-title" id="pmTitle">Sản phẩm</div>
    <div class="modal-sub" id="pmSub"></div>
    <div id="pmPkgs"></div>
  </div>
</div>

<!-- ORDER MODAL -->
<div class="overlay" id="orderOverlay">
  <div class="modal" style="position:relative">
    <button class="modal-close" id="closeOrder"><i class="fas fa-times"></i></button>
    <div class="modal-title">Đơn hàng</div>
    <div class="modal-sub">Kiểm tra & thanh toán</div>
    <div class="os-card" id="orderSummary"></div>
    <div class="coupon-row">
      <input type="text" id="couponInput" placeholder="Mã giảm giá">
      <button type="button" id="applyCoupon">Áp dụng</button>
    </div>
    <div id="couponMsg" style="font-size:.55rem;color:#6ee7b7;text-align:center;min-height:1em;margin-bottom:6px"></div>
    <div class="msg-box" id="orderMsg"></div>
    <div class="actions">
      <button class="btn-copy" id="copyMsg"><i class="fas fa-copy"></i> Copy tin nhắn</button>
      <button class="btn-zalo" id="openZalo"><i class="fas fa-comment"></i> Zalo</button>
      <button class="btn-close" id="closeOrder2"><i class="fas fa-times"></i></button>
    </div>
  </div>
</div>

<!-- NOTICE -->
<div class="overlay" id="noticeOverlay">
  <div class="notice-box">
    <div style="font-size:1.8rem;color:#00e5ff;margin-bottom:8px"><i class="fas fa-bullhorn"></i></div>
    <h2 id="noticeTitle">Thông báo</h2>
    <p id="noticeContent"></p>
    <button type="button" id="noticeOk">Đã hiểu</button>
    <button type="button" id="noticeHideHour" style="background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);color:#a8b8cc">Ẩn 1 giờ</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let products = [], settings = {}, notices = [];
let currentFilter = 'all', currentSearch = '';
let currentProduct = null, currentPkg = null;
let appliedCoupon = null;

function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function parsePrice(p) {
  // "25K" -> 25, "100K" -> 100
  const n = parseFloat(String(p).replace(/[^\d.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function formatPrice(n) {
  return Math.round(n) + 'K';
}

function isAndroid(plat) {
  return /android|apk|adr/i.test(plat || '');
}

async function loadData() {
  try {
    const [prods, sets, notes] = await Promise.all([
      fetch(API + '/api/products').then(r => r.json()),
      fetch(API + '/api/settings').then(r => r.json()),
      fetch(API + '/api/notices').then(r => r.json())
    ]);
    products = prods || [];
    settings = sets || {};
    notices = notes || [];
    document.getElementById('stProducts').textContent = products.length;
    renderFilters();
    renderCatalog();
    showNoticeIfNeeded();
  } catch (e) {
    document.getElementById('catalog').innerHTML = '<div class="empty">Không tải được dữ liệu. Thử lại sau.</div>';
  }
}

function renderFilters() {
  const games = ['all', ...new Set(products.map(p => p.game).filter(Boolean))];
  document.getElementById('filters').innerHTML = games.map(g =>
    `<button class="fbtn ${currentFilter===g?'active':''}" data-g="${g}">${g==='all'?'Tất cả':g}</button>`
  ).join('');
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.onclick = () => {
      currentFilter = btn.dataset.g;
      document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('active', b.dataset.g === currentFilter));
      renderCatalog();
    };
  });
}

function renderCatalog() {
  const q = currentSearch.toLowerCase();
  let list = products.filter(p => {
    if (currentFilter !== 'all' && p.game !== currentFilter) return false;
    if (q && !(p.name + ' ' + (p.game||'') + ' ' + (p.platform||'')).toLowerCase().includes(q)) return false;
    return true;
  });

  // Group by game
  const groups = {};
  list.forEach(p => {
    const g = p.game || 'KHÁC';
    if (!groups[g]) groups[g] = [];
    groups[g].push(p);
  });

  const keys = Object.keys(groups);
  if (!keys.length) {
    document.getElementById('catalog').innerHTML = '<div class="empty">Không tìm thấy sản phẩm</div>';
    return;
  }

  document.getElementById('catalog').innerHTML = keys.map(game => {
    const items = groups[game];
    return `<div class="sec">
      <div class="sec-h"><span class="name">${game}</span><span class="cnt">${items.length}</span></div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.card[data-id]').forEach(el => {
    el.onclick = () => openProduct(Number(el.dataset.id));
  });
}

function cardHTML(p) {
  const allOut = (p.durations || []).every(d => Number(d.stock) === 0);
  const platClass = isAndroid(p.platform) ? 'android' : 'ios';
  const badge = p.badge ? `<span class="badge">${p.badge}</span>` : '';
  return `<div class="card" data-id="${p.id}">
    ${badge}
    <div class="icon-wrap"><i class="fas ${p.icon || 'fa-cube'}"></i></div>
    <div class="cname">${p.name}</div>
    <div class="cplat ${platClass}">${p.platform || ''}</div>
    ${allOut ? '<div class="out">HẾT HÀNG</div>' : ''}
  </div>`;
}

function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  document.getElementById('pmTitle').textContent = p.name;
  document.getElementById('pmSub').textContent = (p.game || '') + ' · ' + (p.platform || '');
  document.getElementById('pmPkgs').innerHTML = (p.durations || []).map((d, i) => {
    const out = Number(d.stock) === 0;
    return `<div class="pkg ${out?'out-of-stock':''}">
      <div>
        <div class="plabel">${d.label}</div>
        <div class="pstock"><i class="fas fa-box"></i> Kho: ${d.stock}</div>
      </div>
      <div class="pprice">${d.price}</div>
      <button class="pbtn" ${out?'disabled':''} onclick="buyPkg(${i})">${out?'Hết':'Mua'}</button>
    </div>`;
  }).join('');
  document.getElementById('productOverlay').classList.add('open');
}

function buyPkg(idx) {
  currentPkg = currentProduct.durations[idx];
  appliedCoupon = null;
  document.getElementById('couponInput').value = '';
  document.getElementById('couponMsg').textContent = '';
  renderOrder();
  document.getElementById('productOverlay').classList.remove('open');
  document.getElementById('orderOverlay').classList.add('open');
}

function calcFinal() {
  let price = parsePrice(currentPkg.price);
  let discount = 0;
  if (appliedCoupon) {
    if (appliedCoupon.type === 'percent') discount = price * (appliedCoupon.value / 100);
    else discount = appliedCoupon.value;
  }
  discount = Math.min(discount, price);
  return { original: price, discount, final: Math.max(0, price - discount) };
}

function renderOrder() {
  const calc = calcFinal();
  document.getElementById('orderSummary').innerHTML = `
    <div class="os-row"><span class="l">Sản phẩm</span><span class="v">${currentProduct.name}</span></div>
    <div class="os-row"><span class="l">Gói</span><span class="v">${currentPkg.label}</span></div>
    <div class="os-row"><span class="l">Giá gốc</span><span class="v">${formatPrice(calc.original)}</span></div>
    ${calc.discount > 0 ? `<div class="os-row"><span class="l">Giảm giá</span><span class="v" style="color:#6ee7b7">-${formatPrice(calc.discount)}</span></div>` : ''}
    <div class="os-row"><span class="l">Thanh toán</span><span class="v" style="color:#00f0ff;font-family:Orbitron,sans-serif">${formatPrice(calc.final)}</span></div>
    ${settings.bankAccount ? `<div class="os-row" style="margin-top:8px;border-top:1px solid rgba(0,255,255,.08);padding-top:8px"><span class="l">STK</span><span class="v">${settings.bankAccount}</span></div>
    <div class="os-row"><span class="l">Ngân hàng</span><span class="v">${settings.bankName || ''}</span></div>
    <div class="os-row"><span class="l">Chủ TK</span><span class="v">${settings.bankOwner || ''}</span></div>` : ''}
  `;
  const msg = `🌟🌟🌟LẤY SẢN PHẨM ${currentProduct.name}-${currentPkg.label}-${formatPrice(calc.final)}${appliedCoupon ? ' (mã '+appliedCoupon.code+')' : ''}-ĐÃ CHUYỂN KHOẢN (gửi kèm bill chuyển khoản) (admin KODER SUPPORT)🔥🔥🔥`;
  document.getElementById('orderMsg').textContent = msg;
}

document.getElementById('applyCoupon').onclick = async () => {
  const code = document.getElementById('couponInput').value.trim();
  if (!code) return toast('Nhập mã giảm giá', true);
  try {
    const res = await fetch(API + '/api/coupons/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Mã không hợp lệ');
    appliedCoupon = data;
    document.getElementById('couponMsg').textContent = '✓ Áp dụng: ' + (data.type === 'percent' ? data.value + '%' : data.value + 'K') + (data.note ? ' — ' + data.note : '');
    renderOrder();
    toast('Đã áp dụng mã ' + data.code);
  } catch (e) {
    appliedCoupon = null;
    document.getElementById('couponMsg').textContent = '';
    toast(e.message, true);
    renderOrder();
  }
};

document.getElementById('copyMsg').onclick = async () => {
  const text = document.getElementById('orderMsg').textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('Đã copy tin nhắn');
  } catch {
    toast('Copy thủ công tin nhắn bên dưới', true);
  }
};

document.getElementById('openZalo').onclick = () => {
  const link = settings.zaloLink || 'https://zalo.me/';
  window.open(link, '_blank');
};

document.getElementById('closeProduct').onclick = () => document.getElementById('productOverlay').classList.remove('open');
document.getElementById('closeOrder').onclick = () => document.getElementById('orderOverlay').classList.remove('open');
document.getElementById('closeOrder2').onclick = () => document.getElementById('orderOverlay').classList.remove('open');
document.getElementById('productOverlay').onclick = (e) => { if (e.target.id === 'productOverlay') e.target.classList.remove('open'); };
document.getElementById('orderOverlay').onclick = (e) => { if (e.target.id === 'orderOverlay') e.target.classList.remove('open'); };

document.getElementById('searchInput').oninput = (e) => {
  currentSearch = e.target.value;
  renderCatalog();
};

// Live stats fake
(function liveStats() {
  let online = 90 + Math.floor(Math.random() * 40);
  setInterval(() => {
    online = Math.max(60, Math.min(180, online + Math.floor(Math.random() * 11) - 5));
    document.getElementById('stOnline').textContent = online;
    document.getElementById('stRate').textContent = (99.5 + Math.random() * 0.5).toFixed(1) + '%';
  }, 12000);
  document.getElementById('stOnline').textContent = online;
})();

// Notice
function showNoticeIfNeeded() {
  if (!notices.length) return;
  try {
    const until = parseInt(localStorage.getItem('koder_notice_hide') || '0', 10);
    if (until && until > Date.now()) return;
  } catch {}
  const n = notices[0];
  document.getElementById('noticeTitle').textContent = n.title;
  document.getElementById('noticeContent').textContent = n.content;
  document.getElementById('noticeOverlay').classList.add('open');
}
document.getElementById('noticeOk').onclick = () => document.getElementById('noticeOverlay').classList.remove('open');
document.getElementById('noticeHideHour').onclick = () => {
  try { localStorage.setItem('koder_notice_hide', String(Date.now() + 3600000)); } catch {}
  document.getElementById('noticeOverlay').classList.remove('open');
};

loadData();
</script>
</body>
